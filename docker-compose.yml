services:

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: facturx-nginx

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./nginx/certs/localhost.key:/etc/nginx/certs/localhost.key:ro

    depends_on:
      - frontend
      - backend
      - mailpit

    networks:
      - facturx-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: facturx-frontend

    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

    environment:
      - VITE_API_URL=

    depends_on:
      - backend

    networks:
      - facturx-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: facturx-backend

    environment:
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}

      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_FROM=${MAIL_FROM}
      - APP_BASE_URL=${APP_BASE_URL}

    volumes:
      - documents-storage:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

    networks:
      - facturx-network


  mailpit:
    image: axllent/mailpit

    container_name: facturx-mailpit

    environment:
      - MP_WEBROOT=/mailpit/

    networks:
      - facturx-network


  postgres:
    image: postgres:17

    container_name: facturx-postgres

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - facturx-network


volumes:
  postgres-data:
  documents-storage:


networks:
  facturx-network:
    driver: bridge
