spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/facturx
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# --- F01 auth: server-side sessions via Spring Session JDBC (see F01_AUTH_BRIEF.md #2) ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=EFACTURE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.session.store-type=jdbc
# PostgreSQL is not an embedded DB, so Spring Session's default (EMBEDDED) would skip
# creating SPRING_SESSION / SPRING_SESSION_ATTRIBUTES - force it on every boot.
spring.session.jdbc.initialize-schema=always
