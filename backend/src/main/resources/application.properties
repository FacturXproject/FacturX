spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/facturx
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# F09: rule_catalog's French explanations are seeded data (data.sql), not code - see
# RuleCatalog. defer-datasource-initialization lets Hibernate create/update the schema
# first, otherwise data.sql's INSERTs run before the table (or its title_fr/... columns)
# exist. sql.init.mode defaults to "embedded" (skips data.sql for a real Postgres) - we
# force it on since we're never using an embedded DB.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# F08 temporary /api/validate endpoint
spring.servlet.multipart.max-file-size=10MB
# Request = file (10 MB max) + multipart overhead, so a file just under 10 MB still fits.
spring.servlet.multipart.max-request-size=11MB

# --- F01 auth: server-side sessions ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=EFACTURE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# --- Mail ---
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Application ---
app.mail.from=${MAIL_FROM:noreply@facturx.local}
app.base-url=${APP_BASE_URL:https://localhost:8443}

# --- F11: internal Python extraction service ---
app.extractor.url=${EXTRACTOR_URL:http://extractor:8000}

# Shared origins for CORS and WebSocket
app.allowed-origins=https://localhost,https://127.0.0.1,https://localhost:8443,https://127.0.0.1:8443

# --- F17: public API (API key + rate limit + OpenAPI docs) ---
# Requests allowed per API key in each fixed window.
app.public-api.rate-limit.requests=${PUBLIC_API_RATE_LIMIT:60}
app.public-api.rate-limit.window-seconds=60
# Only the public API is documented; the session API used by the SPA stays internal.
springdoc.api-docs.path=/api/docs/openapi
springdoc.swagger-ui.path=/api/docs/swagger-ui.html
springdoc.paths-to-match=/api/public/**
# Multipart is parsed when the controller reads the file, so an oversized upload on the
# public API reaches its JSON error handler instead of the session chain's /error page.
spring.servlet.multipart.resolve-lazily=true
