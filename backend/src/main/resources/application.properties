spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/facturx
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# F08 temporary /api/validate endpoint
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- F01 auth: server-side sessions ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=EFACTURE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# --- Mail ---
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Application ---
app.mail.from=${MAIL_FROM:noreply@facturx.local}
app.base-url=${APP_BASE_URL:https://localhost:8443}