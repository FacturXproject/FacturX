name: CI

on:
  pull_request:
  push:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run extractor tests
        working-directory: extractor
        run: |
          # F13: the Factur-X generator embeds DejaVu fonts (PDF/A forbids non-embedded fonts)
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          pip install -r requirements-dev.txt
          pytest

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Show backend logs
        run: docker compose logs backend

      - name: Test backend healthcheck
        run: |
          for i in {1..20}; do
            if curl -k --fail https://localhost:8443/api/healthcheck; then
              echo "Backend healthcheck passed"
              exit 0
            fi

            echo "Backend not ready yet..."
            sleep 3
          done

          echo "Backend healthcheck failed"
          docker compose logs backend
          exit 1

      # F13: golden sample through the whole chain (upload -> extract -> draft ->
      # generate -> Mustang); the job fails unless the generated invoice is VALID.
      - name: Factur-X generation end-to-end
        run: ./scripts/test-f13-generation.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs backend extractor

      - name: Stop containers
        if: always()
        run: docker compose down
