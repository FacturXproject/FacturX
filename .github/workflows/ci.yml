name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Verify backend syntax
        run: |
          python -m py_compile backend/app.py

      - name: Initialize SQLite database
        run: |
          python3 database/init.py

      - name: Verify database contains users
        run: |
          python3 - <<'PY'
import sqlite3
conn = sqlite3.connect('database/app.db')
cur = conn.cursor()
cur.execute("SELECT count(*) FROM users")
cnt = cur.fetchone()[0]
print('users_count=', cnt)
if cnt < 1:
    raise SystemExit('No users found in database')
conn.close()
PY
