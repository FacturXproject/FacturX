name: CI

on: [push, pull_request]

permissions:
  contents: read
  packages: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Verify backend syntax
        run: python -m py_compile backend/app.py

      - name: Initialize SQLite database
        run: python3 database/init.py

      - name: Verify database contains users
        run: |
          python3 - <<'PY'
import sqlite3
conn = sqlite3.connect('database/app.db')
cur = conn.cursor()
cur.execute('SELECT count(*) FROM users')
cnt = cur.fetchone()[0]
print('users_count=', cnt)
if cnt < 1:
    raise SystemExit('No users found in database')
conn.close()
PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: trans-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: trans-frontend:ci

      - name: Start services with docker compose
        run: |
          docker compose -f docker-compose.yml up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 20); do
            if curl -sS http://localhost:5000/healthcheck >/dev/null 2>&1; then
              echo "backend reachable"; exit 0
            fi
            echo "waiting..."; sleep 2
          done
          exit 1

      - name: Verify /users endpoint
        run: |
          curl -sS http://localhost:5000/users | python3 -c "import sys, json; j=json.load(sys.stdin); sys.exit(0 if j.get('users') else 2)"

      - name: Tear down compose
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans
